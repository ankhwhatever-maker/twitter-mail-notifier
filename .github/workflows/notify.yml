name: Send X notification mail

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-notification-mail
  cancel-in-progress: false

jobs:
  send-mail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Run script
        id: notifier
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          
        run: |
          python main.py

      - name: Persist last post
        if: steps.notifier.outcome == 'success'
        run: |
          if git diff --quiet -- last_post.txt; then
            echo "State is unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_post.txt
          git commit -m "Update last notified X post"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload failure diagnostics
        if: steps.notifier.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-realtime-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report notifier failure
        if: steps.notifier.outcome == 'failure'
        run: exit 1
